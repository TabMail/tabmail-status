# Fails when any workflow here runs an action from a tag or branch instead of a
# full commit SHA. Not part of Upptime's generated workflows.
name: Pinned actions
on:
  push:
    paths:
      - ".github/**"
  pull_request:
    paths:
      - ".github/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    name: Every action is pinned to a commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check action references
        run: python3 -I .github/scripts/check-pinned-actions.py
