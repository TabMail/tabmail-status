# TabMail public uptime monitor — https://status.tabmail.ai
# Docs: https://upptime.js.org/docs/configuration
owner: TabMail
repo: tabmail-status

sites:
  # One pair per service: "<name>" probes the service's own /health directly;
  # "<name> · error rate" probes the backend's public status route, which
  # summarises error rates over the last 15 minutes. HTTP 503 = outage (down).
  # A 200 whose body carries "ok":false — "degraded", or "unknown" when the
  # summary is stale — is recorded as degraded, so a stalled summary can never
  # show green. (body_degraded, not *_if_text_missing: the latter also
  # overrides a 503 to degraded — see upptime/uptime-monitor src/update.ts.)
  - name: API
    url: https://api.tabmail.ai/health
  - name: API · error rate
    url: https://api.tabmail.ai/status/public/api
    __dangerous__body_degraded: '"ok":false'
  - name: Auth
    url: https://auth.tabmail.ai/auth/v1/health
    # The Supabase gateway requires the anon (public client) key; this is the
    # same literal the public iOS app ships, so it is not a secret.
    headers:
      - "apikey: sb_publishable_1mtT87g-94P0yxFgM19Itw_P3ih9PUD"
  - name: Usage
    url: https://usage.tabmail.ai/health
  - name: Usage · error rate
    url: https://api.tabmail.ai/status/public/usage
    __dangerous__body_degraded: '"ok":false'
  - name: Templates
    url: https://templates.tabmail.ai/health
  - name: Templates · error rate
    url: https://api.tabmail.ai/status/public/templates
    __dangerous__body_degraded: '"ok":false'
  - name: Billing
    url: https://billing.tabmail.ai/health
  - name: Billing · error rate
    url: https://api.tabmail.ai/status/public/billing
    __dangerous__body_degraded: '"ok":false'
  - name: Device Sync
    url: https://sync.tabmail.ai/health
  - name: Device Sync · error rate
    url: https://api.tabmail.ai/status/public/sync
    __dangerous__body_degraded: '"ok":false'
  - name: Push
    url: https://push.tabmail.ai/health
  - name: Push · error rate
    url: https://api.tabmail.ai/status/public/push
    __dangerous__body_degraded: '"ok":false'

status-website:
  cname: status.tabmail.ai
  # Branding mirrors tabmail-site: same wordmark, favicons, palette (palette.css)
  # and font stack (base.css). The wordmark already says TabMail, so the
  # navbar text is hidden; `name` still titles the page.
  logoUrl: https://tabmail.ai/assets/logo-with-text.svg
  favicon: https://tabmail.ai/assets/favicon-32x32.png
  faviconSvg: https://tabmail.ai/assets/logo-icon-only.svg
  name: TabMail Status
  css: |
    :root {
      --body-background-color: #fff;
      --body-text-color: #15141a;
      --card-background-color: #f9f9fa;
      --card-border-color: #ededf0;
      --nav-background-color: #fff;
      --nav-border-bottom-color: #ededf0;
      --nav-current-border-bottom-color: #0060df;
      --up-border-left-color: #058b00;
      --tag-up-background-color: #058b00;
      --degraded-border-left-color: #cd6200;
      --tag-degraded-background-color: #cd6200;
      --change-background-color: #cd6200;
      --down-border-left-color: #c50042;
      --down-background-color: #ffe5ec;
      --tag-down-background-color: #c50042;
      --submit-button-background-color: #0060df;
      --submit-button-border-color: #0060df;
      --error-button-background-color: #0060df;
      --error-button-border-color: #0060df;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --body-background-color: #1c1b22;
        --body-text-color: #fbfbfe;
        --card-background-color: #2b2a33;
        --card-border-color: #2b2a33;
        --nav-background-color: #1c1b22;
        --nav-border-bottom-color: #2b2a33;
        --nav-current-border-bottom-color: #0a84ff;
        --down-background-color: #4a1020;
        --submit-button-background-color: #0a84ff;
        --submit-button-border-color: #0a84ff;
        --error-button-background-color: #0a84ff;
        --error-button-border-color: #0a84ff;
      }
      nav .logo img { content: url("https://tabmail.ai/assets/logo-with-text-dark.svg"); }
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    nav { font-weight: 500; font-size: 0.9375rem; padding: 0 2rem; }
    nav .logo { padding: 1.5rem 0; margin-right: 2rem; }
    nav .logo img { height: 32px; width: auto; margin-right: 0; border-radius: 0; }
    nav .logo > div { display: none; }
    nav ul a { padding: 1.5rem 1rem; }
    a { color: #0060df; }
    @media (prefers-color-scheme: dark) { a { color: #0a84ff; } }
  introTitle: "**TabMail** service status"
  introMessage: Live uptime, response times and incident history for TabMail's services, checked every five minutes from outside our infrastructure. Data is generated automatically by [Upptime](https://upptime.js.org) in [this repository](https://github.com/TabMail/tabmail-status).
  navbar:
    - title: Status
      href: /
    - title: TabMail
      href: https://tabmail.ai
    - title: Support
      href: https://github.com/TabMail/tabmail-support
